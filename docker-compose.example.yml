# ─── AMD AI Key Balancer — Docker Compose 示例配置 ───────────────────────────
#
# 快速上手：
#   1. 复制本文件为实际生效的 compose 文件：
#      cp docker-compose.example.yml docker-compose.yml
#   2. 复制环境变量示例文件：
#      cp .env.example .env
#   3. 根据需要修改 .env 填入你的 AMD API Key 和 token
#   4. 启动服务：
#      docker compose up -d              # 本地开发，访问 http://localhost:8787
#      docker compose run --rm deploy    # 一键部署到 Cloudflare Workers
#
# 说明：
#   - 本地 dev 模式使用 wrangler dev，功能与线上 Workers 一致
#   - Durable Objects 数据存在容器内挂载的 volume，容器重建数据不丢失
#   - 部署到 Cloudflare 需要在 .env 里配置 CLOUDFLARE_API_TOKEN
# ──────────────────────────────────────────────────────────────────────────────

name: amd-api-balancer

services:
  # ── 本地开发/自建服务 ──────────────────────────────────────────────────────
  dev:
    build: .
    image: amd-api-balancer:local
    container_name: amd-balancer-dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false      # .env 不存在时不报错，可以只用 environment 块
    environment:
      # 时区（让日志时间对齐）
      TZ: ${TZ:-Asia/Shanghai}
      # 这些变量对应 wrangler dev 读取的配置键名，优先级：environment > env_file
      AMD_ACCOUNTS: ${AMD_ACCOUNTS:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      ADMIN_TOKEN:  ${ADMIN_TOKEN:-}
    ports:
      - "${PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 持久化 Durable Object 状态（冷却、额度缓存等）
      - wrangler-state:/app/.wrangler/state
      # 热更新：把本地 src/ 挂载进容器，修改源码无需重建镜像
      - ./src:/app/src:ro
    command: >
      npx wrangler dev
        --ip 0.0.0.0
        --port 8787
        --persist-to /app/.wrangler/state
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── 部署到 Cloudflare Workers ──────────────────────────────────────────────
  # 用法：docker compose run --rm deploy
  deploy:
    build: .
    image: amd-api-balancer:local
    env_file:
      - path: .env
        required: false
    environment:
      # Cloudflare 认证（必须）
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      # 部署时注入为 Cloudflare Secret
      AMD_ACCOUNTS: ${AMD_ACCOUNTS:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      ADMIN_TOKEN:  ${ADMIN_TOKEN:-}
    command: >
      sh -c "
        echo '=== 检查 Cloudflare 认证 ===' &&
        if [ -z \"$$CLOUDFLARE_API_TOKEN\" ]; then
          echo 'ERROR: 请设置 CLOUDFLARE_API_TOKEN' && exit 1;
        fi &&
        echo '=== 注入 Secrets ===' &&
        if [ -n \"$$AMD_ACCOUNTS\" ]; then
          echo \"$$AMD_ACCOUNTS\" | npx wrangler secret put AMD_ACCOUNTS;
        fi &&
        if [ -n \"$$ACCESS_TOKEN\" ]; then
          echo \"$$ACCESS_TOKEN\" | npx wrangler secret put ACCESS_TOKEN;
        fi &&
        if [ -n \"$$ADMIN_TOKEN\" ]; then
          echo \"$$ADMIN_TOKEN\" | npx wrangler secret put ADMIN_TOKEN;
        fi &&
        echo '=== 开始部署 ===' &&
        npx wrangler deploy
      "
    profiles:
      - deploy            # 不在 docker compose up 默认启动中，仅在显式调用时运行

volumes:
  wrangler-state:
    driver: local
